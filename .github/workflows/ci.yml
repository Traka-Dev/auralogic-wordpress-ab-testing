name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check PHP syntax
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: docker run --rm -v "$PWD:/app:ro" -w /app "php:${PHP_VERSION}-cli" sh scripts/lint-php.sh

  integration:
    name: WordPress and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run dev:setup
      - run: npm run test:integration
      - run: npm run test:http
      - run: npm run test:browser
      - run: npm run build
      - run: npm run check:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: builder-ab-testing
          path: dist/builder-ab-testing.zip
          if-no-files-found: error
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop disposable CI environment
        if: always()
        run: docker compose down -v
